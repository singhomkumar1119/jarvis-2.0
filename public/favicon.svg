<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="jarvisGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="1"/>
      <stop offset="45%" stop-color="#4facfe" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#0052d4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0a0b10" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#70f3ff"/>
      <stop offset="75%" stop-color="#00c6ff"/>
      <stop offset="100%" stop-color="#0072ff"/>
    </radialGradient>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep dark futuristic background -->
  <rect width="64" height="64" rx="16" fill="#08090d"/>

  <!-- Radial ambient glow -->
  <circle cx="32" cy="32" r="28" fill="url(#jarvisGlow)"/>

  <!-- Outer Arc Reactor Ring -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#00f2fe" stroke-width="1.8" stroke-opacity="0.6" stroke-dasharray="4 2.5"/>
  <circle cx="32" cy="32" r="18" fill="none" stroke="#4facfe" stroke-width="1.2" stroke-opacity="0.9"/>

  <!-- Reactor segments -->
  <g stroke="#70f3ff" stroke-width="2" stroke-linecap="round" opacity="0.85">
    <line x1="32" y1="9" x2="32" y2="13"/>
    <line x1="32" y1="51" x2="32" y2="55"/>
    <line x1="9" y1="32" x2="13" y2="32"/>
    <line x1="51" y1="32" x2="55" y2="32"/>
    <line x1="16" y1="16" x2="19" y2="19"/>
    <line x1="45" y1="45" x2="48" y2="48"/>
    <line x1="48" y1="16" x2="45" y2="19"/>
    <line x1="19" y1="45" x2="16" y2="48"/>
  </g>

  <!-- Inner glowing Core -->
  <circle cx="32" cy="32" r="10" fill="url(#coreGlow)" filter="url(#neon)"/>
  <!-- Pure energy center -->
  <circle cx="32" cy="32" r="4.5" fill="#ffffff"/>
</svg>

